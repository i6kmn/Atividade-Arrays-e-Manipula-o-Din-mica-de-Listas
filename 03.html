<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lista de Tarefas</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    select, input, button {
      margin: 5px;
    }
    .alta {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>📝 Lista de Tarefas</h2>

  <input type="text" id="titulo" placeholder="Título da tarefa">

  <select id="prioridade">
    <option value="baixa">Baixa</option>
    <option value="media">Média</option>
    <option value="alta">Alta</option>
  </select>

  <button onclick="adicionarTarefa()">Adicionar</button>

  <ul id="lista"></ul>

  <script>
    let tarefas = [];

    function adicionarTarefa() {
      const titulo = document.getElementById("titulo").value.trim();
      const prioridade = document.getElementById("prioridade").value;

      if (titulo === "") return;

      const novaTarefa = { titulo, prioridade };

      // regra principal
      if (prioridade === "alta") {
        tarefas.unshift(novaTarefa); // início
      } else {
        tarefas.push(novaTarefa); // final
      }

      document.getElementById("titulo").value = "";
      atualizarLista();
    }

    function atualizarLista() {
      const ul = document.getElementById("lista");
      ul.innerHTML = "";

      tarefas.forEach(tarefa => {
        const li = document.createElement("li");

        li.textContent = `${tarefa.titulo} (${tarefa.prioridade})`;

        if (tarefa.prioridade === "alta") {
          li.classList.add("alta");
        }

        ul.appendChild(li);
      });
    }
  </script>

</body>
</html>
